    <script>
        function isPalindrome(str) {
    let j = str.length - 1
    for (let i = 0; i < str.length / 2; i++) {
        if (str[i] != str[j]) {//i=0, j=6
            // i=1, j=5
            // i=2, j=4
            // i=3 , j=3
            //i=4, j=2 condition false
            return "It is not a palindrome";
        }
        j--; 
    }
    return "It is a palindrome";
}
let str = "was it a car or a cat i saw";
str = str.replaceAll(" ", "")
document.getElementById("result").innerHTML = isPalindrome(str)
